[package]
name = "file-reporter"
version = "0.4.0"
edition = "2021"
# Mínimo que exigen egui/eframe 0.37.
rust-version = "1.95"
description = "Fast CLI + GUI to scan folders and generate CSV, Markdown and JSON reports"
license = "MIT"
repository = "https://github.com/dbarretol/file-reporter"
readme = "README.md"
keywords = ["cli", "gui", "filesystem", "report", "directory"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"
indicatif = "0.18"    # Spinner de progreso de la CLI
# Detalle de lo omitido durante el escaneo (`-v` en la CLI).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "std"] }

# GUI
#
# `x11` y `wayland` son imprescindibles en Linux: sin ellas (al desactivar
# las default-features) winit no tiene backend de ventanas y el crate no
# compila ("platform not supported by winit"). En Windows/macOS no afectan.
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
# Desde 0.37 las fuentes de emoji ya no vienen por defecto; la interfaz usa
# emoji en etiquetas y botones.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.18"          # Diálogo nativo de selección de carpetas

# Incrusta el icono y los metadatos de versión en el .exe (ver build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
# No usar panic = "abort": rompería el catch_unwind del worker de la GUI
# (src/gui/run.rs, start_run) que evita que un panic interno tumbe la app.
strip = true
# Para probar la app durante el desarrollo: casi tan rápida como `release`
# pero sin LTO y con compilación incremental, así que recompila en segundos
# en vez de minutos. Uso: `cargo run --profile fast` (sale en target/fast/).
[profile.fast]
inherits = "release"
lto = false
strip = false
codegen-units = 256
incremental = true
