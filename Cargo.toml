[package]
name = "file-reporter"
version = "0.2.0"
edition = "2021"
description = "Fast CLI + GUI to scan folders and generate CSV, Markdown and JSON reports"
license = "MIT"
repository = "https://github.com/dbarretol/file-reporter"
readme = "README.md"
keywords = ["cli", "gui", "filesystem", "report", "directory"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"

# GUI
#
# Fijado en 0.30 (no la última disponible) a propósito: 0.31+ renombra
# Rounding -> CornerRadius y cambia Margin/CornerRadius/Shadow de f32 a
# i8/u8, y 0.34+ reemplaza el método `update` de `eframe::App` por `ui`
# con una firma distinta — ambos son refactors de API reales, no fixes,
# y quedan fuera del alcance de esta tarea (ver tasks.md, punto 25).
# 0.30 sí trae mejoras de plataforma sobre 0.28 sin requerir cambios de
# código en este crate (build+test+clippy verificados sin tocar src/).
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.30"
rfd = "0.15"          # Diálogo nativo de selección de carpetas

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
# No usar panic = "abort": rompería el catch_unwind del worker de la GUI
# (src/gui.rs, start_run) que evita que un panic interno tumbe la app.
strip = true