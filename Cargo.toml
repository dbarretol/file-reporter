[package]
name = "file-reporter"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"        # Paralelismo para grandes volúmenes

[profile.release]
opt-level = 3
lto = true