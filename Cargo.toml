[package]
name = "file-reporter"
version = "0.2.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"

# GUI
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
rfd = "0.14"          # Diálogo nativo de selección de carpetas

[profile.release]
opt-level = 3
lto = true